career-profile:
    title: About Me
    summary: |
      I am a research assistant at the Korea SMEs & Startups Institute, with an MS in Economics from the University of Wisconsin–Madison. My research asks why some firms achieve a turnaround while others survive only through continued support, with a focus on the firm-level heterogeneity that drives this divergence.
      
      I am also interested in spillover effects and market microstructure.
      
